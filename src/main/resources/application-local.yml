# Settings for running on a developer machine. This profile also turns off authentication.
spring:
  # During `./gradlew bootRun` the connection comes from compose.yaml and these values aren't used.
  # They apply when the application is started some other way against a Postgres on port 5432.
  datasource:
    url: jdbc:postgresql://localhost:5432/crm_demo_user_management_service_db
    username: crm_demo_user_management_service_local
    password: local
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/crm-admin   # unused while the local profile turns authentication off
      client:
        registration:
          ums-internal:
            client-secret: ums-internal-local-secret
          ums-portal:
            client-secret: ums-portal-local-secret
        provider:
          crm-internal:
            token-uri: http://localhost:8180/realms/crm-internal/protocol/openid-connect/token
          portal:
            token-uri: http://localhost:8180/realms/portal/protocol/openid-connect/token
  kafka:
    bootstrap-servers: localhost:9092
ums:
  keycloak:
    base-url: http://localhost:8180   # local-docker/keycloak
  corporate-domains: crm.local,corp.example
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
