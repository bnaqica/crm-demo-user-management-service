# Defaults for every environment. Values come from environment variables so the
# same image runs anywhere; the `local` profile fills them in for local development.
server:
  port: 8083

spring:
  application:
    name: crm-demo-user-management-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    properties:
      hibernate:
        default_schema: crm_demo_user_management_service
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: crm_demo_user_management_service   # never the public schema
    schemas: crm_demo_user_management_service,audit
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}   # the crm-admin realm
      client:
        # Service accounts for the Keycloak Admin REST API, one per realm the UMS manages
        registration:
          ums-internal:
            provider: crm-internal
            client-id: ums-internal
            client-secret: ${KEYCLOAK_UMS_INTERNAL_SECRET}
            authorization-grant-type: client_credentials
          ums-portal:
            provider: portal
            client-id: ums-portal
            client-secret: ${KEYCLOAK_UMS_PORTAL_SECRET}
            authorization-grant-type: client_credentials
          ums-admin:
            provider: crm-admin
            client-id: ums-admin
            client-secret: ${KEYCLOAK_UMS_ADMIN_SECRET}
            authorization-grant-type: client_credentials
        provider:
          crm-admin:
            token-uri: ${KEYCLOAK_BASE_URL}/realms/crm-admin/protocol/openid-connect/token
          crm-internal:
            token-uri: ${KEYCLOAK_BASE_URL}/realms/crm-internal/protocol/openid-connect/token
          portal:
            token-uri: ${KEYCLOAK_BASE_URL}/realms/portal/protocol/openid-connect/token
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: crm-demo-user-management-service
      auto-offset-reset: earliest
    producer:
      acks: all

ums:
  audit:
    # User attributes never stored in audit records, comma-separated (credentials and tokens never are)
    sensitive-attributes: ${UMS_AUDIT_SENSITIVE_ATTRIBUTES:}
    partition-cron: ${UMS_AUDIT_PARTITION_CRON:0 30 2 * * *}   # creates next month's audit partition ahead
    search:
      max-range: ${UMS_AUDIT_SEARCH_MAX_RANGE:90d}   # longest time range one audit search may cover
    # The central audit database (crm_audit_db), separate from this service's own
    datasource:
      url: ${AUDIT_DB_URL}
      owner-username: ${AUDIT_DB_OWNER_USERNAME}     # runs the audit migrations
      owner-password: ${AUDIT_DB_OWNER_PASSWORD}
      writer-username: ${AUDIT_DB_WRITER_USERNAME}   # INSERT only
      writer-password: ${AUDIT_DB_WRITER_PASSWORD}
      reader-username: ${AUDIT_DB_READER_USERNAME}   # SELECT only
      reader-password: ${AUDIT_DB_READER_PASSWORD}
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL}
  # Issuer of crm-internal service tokens, accepted on /internal/** only
  internal-issuer-uri: ${JWT_INTERNAL_ISSUER_URI}
  # Issuer of portal tokens; accepted on /internal/** only to refuse them with 403
  portal-issuer-uri: ${JWT_PORTAL_ISSUER_URI}
  cors:
    allowed-origins: ${UMS_CORS_ALLOWED_ORIGINS:}   # browser origins allowed on /admin/**, comma-separated (the Admin UI)
  promotion:
    rate-limit-per-minute: ${UMS_PROMOTION_RATE_LIMIT:60}   # promote calls allowed per minute and instance
  cleanup:
    cron: ${UMS_CLEANUP_CRON:0 0 3 * * *}   # when unpromoted starters expire and unused invites are removed
    starter-expiry-days: ${UMS_STARTER_EXPIRY_DAYS:30}   # a starter not promoted within this is disabled
  grant-request-ttl: ${UMS_GRANT_REQUEST_TTL:72h}   # a privileged grant not approved in this time expires
  # Keycloak user id of the break-glass admin; a login with it raises an alert. Empty: none configured
  break-glass-admin-id: ${UMS_BREAK_GLASS_ADMIN_ID:}
  team-scope:
    super-manager-cache-ttl: ${UMS_SUPER_MANAGER_CACHE_TTL:1m}   # how long a Super Manager lookup is reused
  # Email domains of employees; comma-separated
  corporate-domains: ${UMS_CORPORATE_DOMAINS}
  invite-lifespan: ${UMS_INVITE_LIFESPAN:72h}   # how long invite links work
  lockout-alert:
    threshold: ${UMS_LOCKOUT_ALERT_THRESHOLD:5}   # alert when more accounts than this lock...
    window: ${UMS_LOCKOUT_ALERT_WINDOW:5m}        # ...within this time
  outbox:
    relay-interval: ${UMS_OUTBOX_RELAY_INTERVAL:1s}
  topics:
    keycloak-events: keycloak-events   # published by the Keycloak event-listener SPI
    user-events: ums-user-events
    audit-events: audit-events

management:
  endpoints:
    web:
      exposure:
        include: health,info

# API docs are only switched on by the `local` profile
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
